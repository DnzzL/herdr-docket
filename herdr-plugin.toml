id = "dnzzl.herdr-docket"
name = "Herdr-Docket"
version = "0.6.0"
min_herdr_version = "0.8.0"
description = "A shared task queue worked by your agents — Backlog.md, Basecamp or GitHub Projects — assign a task to a named agent and the daemon runs it, one at a time."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["./bin/herdr-docket", "daemon"]

[[actions]]
id = "run-task"
title = "Herdr-Docket: run a task now"
contexts = ["workspace"]
command = ["./bin/herdr-docket", "pane"]

[[panes]]
id = "board"
title = "Herdr-Docket"
placement = "overlay"
command = ["./bin/herdr-docket", "pane"]
