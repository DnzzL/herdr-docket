id = "dnzzl.fleet"
name = "Fleet"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "A shared task queue worked by your Herdr agents — Backlog.md or Basecamp — assign a task to a named agent and the daemon runs it, one at a time."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["./bin/herdr-fleet", "daemon"]

[[actions]]
id = "run-task"
title = "Fleet: run a task now"
contexts = ["workspace"]
command = ["./bin/herdr-fleet", "pane"]

[[panes]]
id = "board"
title = "Fleet"
placement = "overlay"
command = ["./bin/herdr-fleet", "pane"]
