name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # The same four assets scripts/install.sh looks for, under the version
      # this tag names, with the checksums it verifies the download against.
      - name: Build binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.Version=${version}" \
              -o "dist/herdr-docket_${os}_${arch}" .
          done
          cd dist && sha256sum herdr-docket_* > checksums.txt

      # The CHANGELOG is written for someone using the plugin; a generated
      # list of commit subjects is not. Fall back to one only if this tag has
      # no section, which means somebody forgot.
      - name: Extract the release notes
        id: notes
        run: |
          awk -v tag="## ${GITHUB_REF_NAME} " '
            index($0, tag) == 1 { found = 1; next }
            found && /^## / { exit }
            found && !seen && /^[[:space:]]*$/ { next }
            found { seen = 1; print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CHANGELOG.md section for ${GITHUB_REF_NAME}"
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
            else
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
